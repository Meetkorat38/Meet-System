<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Foresight: workbooks become governed tables, then a grounded answer a person reviews">
  <rect x="0" y="0" width="640" height="400" fill="#14121b"/>
  <text x="36" y="48" font-family="monospace" font-size="11" letter-spacing="1.5" fill="#8f83a8">WORKBOOKS → GOVERNED TABLES</text>
  <text x="472" y="48" font-family="monospace" font-size="11" letter-spacing="1.5" fill="#8f83a8">GROUNDED ANSWER</text>

  <!-- source workbooks -->
  <rect x="36" y="84" width="150" height="156" rx="14" fill="#1d1a28" stroke="#3b3554" stroke-width="1.5"/>
  <g font-family="monospace" font-size="10" fill="#cfc6e4">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.94;1" dur="9s" repeatCount="indefinite"/>
      <rect x="52" y="104" width="22" height="18" rx="4" fill="#2a2540" stroke="#3b3554"/>
      <rect x="82" y="106" width="88" height="7" rx="3.5" fill="#8b7bb8"/>
      <rect x="82" y="115" width="54" height="5" rx="2.5" fill="#5d5478"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.08;0.16;0.94;1" dur="9s" repeatCount="indefinite"/>
      <rect x="52" y="130" width="22" height="18" rx="4" fill="#2a2540" stroke="#3b3554"/>
      <rect x="82" y="132" width="76" height="7" rx="3.5" fill="#8b7bb8"/>
      <rect x="82" y="141" width="46" height="5" rx="2.5" fill="#5d5478"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.14;0.22;0.94;1" dur="9s" repeatCount="indefinite"/>
      <rect x="52" y="156" width="22" height="18" rx="4" fill="#2a2540" stroke="#3b3554"/>
      <rect x="82" y="158" width="94" height="7" rx="3.5" fill="#8b7bb8"/>
      <rect x="82" y="167" width="56" height="5" rx="2.5" fill="#5d5478"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.28;0.94;1" dur="9s" repeatCount="indefinite"/>
      <rect x="52" y="182" width="22" height="18" rx="4" fill="#2a2540" stroke="#3b3554"/>
      <rect x="82" y="184" width="64" height="7" rx="3.5" fill="#8b7bb8"/>
      <rect x="82" y="193" width="40" height="5" rx="2.5" fill="#5d5478"/>
    </g>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.2;0.94;1" dur="9s" repeatCount="indefinite"/>
    <rect x="140" y="206" width="34" height="20" rx="6" fill="#1d1a28" stroke="#3b3554"/>
    <text x="157" y="220" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#8f83a8">XLS</text>
  </g>

  <!-- connectors -->
  <g fill="none" stroke="#3b3554" stroke-width="1.5">
    <path id="f-ingest" d="M186,160 L232,160 C248,160 248,114 268,114"/>
    <path id="f-clean" d="M268,188 L312,188 C326,188 326,188 344,188"/>
    <path id="f-model" d="M268,258 L312,258 C326,258 326,258 344,258"/>
    <path id="f-query" d="M448,160 L472,160 C488,160 488,132 506,132"/>
  </g>
  <circle r="4.5" fill="#a78bfa" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.4;0.5" dur="9s" repeatCount="indefinite"/>
    <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;0.5" calcMode="linear">
      <mpath href="#f-ingest"/>
    </animateMotion>
  </circle>
  <circle r="4.5" fill="#a78bfa" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.32;0.5;0.56" dur="9s" repeatCount="indefinite"/>
    <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0.3;0.55" calcMode="linear">
      <mpath href="#f-clean"/>
    </animateMotion>
  </circle>

  <!-- medallion layers -->
  <g opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.4;1;1;0.4" keyTimes="0;0.2;0.32;0.94;1" dur="9s" repeatCount="indefinite"/>
    <rect x="268" y="84" width="180" height="60" rx="12" fill="#1d1a28" stroke="#3b3554" stroke-width="1.5"/>
    <text x="308" y="110" font-family="monospace" font-size="10" fill="#e8e2f5">BRONZE · RAW</text>
    <text x="308" y="125" font-family="monospace" font-size="9" fill="#8f83a8">untouched landing</text>
    <rect x="268" y="158" width="180" height="60" rx="12" fill="#1d1a28" stroke="#3b3554" stroke-width="1.5"/>
    <text x="308" y="184" font-family="monospace" font-size="10" fill="#e8e2f5">SILVER · CLEAN</text>
    <text x="308" y="199" font-family="monospace" font-size="9" fill="#8f83a8">PII stripped</text>
    <rect x="268" y="228" width="180" height="60" rx="12" fill="#1d1a28" stroke="#3b3554" stroke-width="1.5"/>
    <text x="308" y="254" font-family="monospace" font-size="10" fill="#e8e2f5">GOLD · MODELLED</text>
    <text x="308" y="269" font-family="monospace" font-size="9" fill="#8f83a8">queryable P+L</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.36;0.94;1" dur="9s" repeatCount="indefinite"/>
    <rect x="330" y="142" width="56" height="20" rx="10" fill="#1d1a28" stroke="#3b3554"/>
    <text x="358" y="156" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#8f83a8">− PII</text>
  </g>

  <!-- answer card -->
  <rect x="472" y="76" width="132" height="184" rx="14" fill="#1d1a28" stroke="#3b3554" stroke-width="1.5"/>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.52;0.6;0.94;1" dur="9s" repeatCount="indefinite"/>
    <rect x="486" y="92" width="104" height="9" rx="4.5" fill="#8b7bb8"/>
    <rect x="486" y="108" width="70" height="18" rx="5" fill="none" stroke="#3b3554"/>
    <text x="521" y="121" text-anchor="middle" font-family="monospace" font-size="9" fill="#8f83a8">SQL</text>
    <rect x="486" y="136" width="104" height="7" rx="3.5" fill="#8b7bb8"/>
    <rect x="486" y="152" width="88" height="7" rx="3.5" fill="#6d608f"/>
    <rect x="486" y="168" width="96" height="7" rx="3.5" fill="#5d5478"/>
    <path d="M486,172 C460,202 420,222 372,244" stroke="#8f83a8" stroke-dasharray="4 4" fill="none"/>
    <circle cx="372" cy="244" r="4" fill="#4ade80"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.76;0.82;0.94;1" dur="9s" repeatCount="indefinite"/>
    <circle cx="584" cy="240" r="14" fill="#1d1a28" stroke="#3b3554" stroke-width="1.5"/>
    <path d="M577,240 L582,245 L592,234" fill="none" stroke="#e8e2f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="monospace" font-size="10" letter-spacing="1" fill="#8f83a8">
    <text x="36" y="368" opacity="1">INGEST<animate attributeName="opacity" values="1;0.3;0.3;1" keyTimes="0;0.26;0.9;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="148" y="368" opacity="0.3">MODEL<animate attributeName="opacity" values="0.3;1;0.3;0.3" keyTimes="0;0.3;0.56;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="272" y="368" opacity="0.3">QUERY<animate attributeName="opacity" values="0.3;0.3;1;0.3" keyTimes="0;0.5;0.62;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="382" y="368" opacity="0.3">VERIFY<animate attributeName="opacity" values="0.3;0.3;1;0.3" keyTimes="0;0.65;0.8;1" dur="9s" repeatCount="indefinite"/></text>
  </g>
</svg>
